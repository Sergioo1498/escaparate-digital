<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Línea temporal con cinco hitos legales de un pedido online" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Línea temporal con cinco hitos legales de un pedido online</title>
<rect width="880" height="400" fill="#ffffff"/>
<text x="40" y="44" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="22" font-weight="700" fill="#1e1c19">Los plazos de un pedido online, de un vistazo</text>
<text x="40" y="70" font-size="14" fill="#5c574f">Obligaciones del vendedor frente a un consumidor en España</text>
<line x1="115" y1="170" x2="763" y2="170" stroke="#e3ddd2" stroke-width="6" stroke-linecap="round"/>
<circle cx="115" cy="170" r="22" fill="#1f6f6b"/>
<text x="115" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="115" y="226" font-size="16" font-weight="700" fill="#1e1c19" text-anchor="middle">Antes de comprar</text>
<text x="115" y="250" font-size="12.5" fill="#5c574f" text-anchor="middle">Identidad del vendedor,</text>
<text x="115" y="268" font-size="12.5" fill="#5c574f" text-anchor="middle">precio final y condiciones</text>
<circle cx="277" cy="170" r="22" fill="#1f6f6b"/>
<text x="277" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="277" y="226" font-size="16" font-weight="700" fill="#1e1c19" text-anchor="middle">Al pagar</text>
<text x="277" y="250" font-size="12.5" fill="#5c574f" text-anchor="middle">Botón que deje claro que</text>
<text x="277" y="268" font-size="12.5" fill="#5c574f" text-anchor="middle">el pedido obliga a pagar</text>
<circle cx="439" cy="170" r="22" fill="#a8401f"/>
<text x="439" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="439" y="226" font-size="16" font-weight="700" fill="#1e1c19" text-anchor="middle">24 horas</text>
<text x="439" y="250" font-size="12.5" fill="#5c574f" text-anchor="middle">Confirmación de que</text>
<text x="439" y="268" font-size="12.5" fill="#5c574f" text-anchor="middle">el pedido se ha recibido</text>
<circle cx="601" cy="170" r="22" fill="#a8401f"/>
<text x="601" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="601" y="226" font-size="16" font-weight="700" fill="#1e1c19" text-anchor="middle">14 días</text>
<text x="601" y="250" font-size="12.5" fill="#5c574f" text-anchor="middle">Desistimiento sin dar</text>
<text x="601" y="268" font-size="12.5" fill="#5c574f" text-anchor="middle">explicaciones</text>
<circle cx="763" cy="170" r="22" fill="#4a4458"/>
<text x="763" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="763" y="226" font-size="16" font-weight="700" fill="#1e1c19" text-anchor="middle">3 años</text>
<text x="763" y="250" font-size="12.5" fill="#5c574f" text-anchor="middle">Garantía legal de los</text>
<text x="763" y="268" font-size="12.5" fill="#5c574f" text-anchor="middle">bienes nuevos</text>
<text x="40" y="360" font-size="12.5" fill="#5c574f">Fuente: Ley 34/2002 (LSSI-CE) y texto refundido de la Ley General para la Defensa de los Consumidores</text>
<text x="40" y="378" font-size="12.5" fill="#5c574f">y Usuarios (RDL 1/2007). Esquema propio.</text>
</svg>
